name: Weekly compatibility check

# Once a week, install the newest Claude Code release inside this runner and
# check that the hook still gets what it relies on. Nothing here signs in or
# uses an API key, so it checks what can be checked without one:
#
#   1. Every event the hook registers in its module (session.start,
#      turn.complete, session.measure) is still an event the engine knows.
#      `claude plugin validate` refuses a module that hooks an unknown event.
#   2. The hook's tests still pass against the newest engine. The tests
#      register on session.usage, fs.write, clock.now and the environment
#      reads, so an engine that dropped or renamed one of those fails here,
#      and the engine checks the inputs the tests raise.
#   3. The names the hook reads from the usage reading (rateLimits,
#      five_hour, seven_day, percentUsed, resetsAt; "kind" is too common a
#      word to be worth checking) still occur in the engine's program. This
#      is a coarse signal only: it catches a name that disappears, not one
#      that keeps its name and changes meaning or moves elsewhere.
#
# What it cannot see: whether a signed-in subscription session really reports
# a five-hour window at run time, and whether session.measure still lists
# "rateLimits" among what changed. Those need a real, signed-in session.
#
# On failure it opens one issue titled "Compatibility check failed", or adds a
# comment to that issue if it is already open. A passing run makes no noise.

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: compat-weekly
  cancel-in-progress: false

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the newest Claude Code (inside this runner only)
        id: install
        run: |
          npm install --no-save --no-fund --no-audit \
            --prefix "$RUNNER_TEMP/claude-code" \
            "@anthropic-ai/claude-code@latest"
          echo "$RUNNER_TEMP/claude-code/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Record the version
        id: version
        run: |
          v="$(claude --version)"
          echo "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: "Check 1: the hook's events still exist"
        id: events
        run: claude plugin validate cooldown-usage-feed

      - name: "Check 2: the hook's tests pass on the newest engine"
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: claude plugin test cooldown-usage-feed

      - name: "Check 3: the usage names the hook reads are still in the engine"
        id: names
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bin="$(readlink -f "$(command -v claude)")"
          size="$(stat -c %s "$bin")"
          echo "engine program: $bin ($size bytes)"
          if [ "$size" -lt 20000000 ]; then
            echo "::error::Found a launcher, not the engine program; cannot check names."
            exit 1
          fi
          missing=0
          for name in rateLimits five_hour seven_day percentUsed resetsAt '"session.usage"' '"session.measure"'; do
            if grep -a -q -F -e "$name" "$bin"; then
              echo "found:   $name"
            else
              echo "::error::missing: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Open or update the issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Compatibility check failed
          VERSION: ${{ steps.version.outputs.version }}
          INSTALL: ${{ steps.install.outcome }}
          EVENTS: ${{ steps.events.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          NAMES: ${{ steps.names.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The weekly check against the newest Claude Code release failed."
            echo
            echo "- Claude Code: ${VERSION:-not installed}"
            echo "- Install: ${INSTALL:-skipped}"
            echo "- Check 1, the hook's events still exist: ${EVENTS:-skipped}"
            echo "- Check 2, the hook's tests pass: ${TESTS:-skipped}"
            echo "- Check 3, the usage names are still in the engine: ${NAMES:-skipped}"
            echo
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/issue.md"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
